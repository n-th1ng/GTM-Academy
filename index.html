<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A practical, human-reviewed academy for cold email and LinkedIn outreach."
    />
    <meta name="theme-color" content="#111b33" />
    <title>GTM Academy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ef6a3a'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='36' font-weight='700' fill='%230a1224'%3EG%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to course content</a>

    <header class="site-header">
      <a class="brand" href="#home" aria-label="GTM Academy home">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span>
          <strong>GTM Academy</strong>
          <small>Human-reviewed outbound</small>
        </span>
      </a>

      <nav class="header-actions" aria-label="Course actions">
        <button class="text-button" id="resources-button" type="button">Resources</button>
        <div class="header-progress" id="header-progress" role="progressbar" aria-label="Course completion" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
          <span id="header-progress-label">0 of 6 complete</span>
          <span class="mini-progress" aria-hidden="true"><span id="header-progress-bar"></span></span>
        </div>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">
      <div id="app" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p>Research like software. Write like a human.</p>
      <p>Completion means ready for supervised outreach—not independent campaign authorization.</p>
    </footer>

    <dialog class="resource-dialog" id="resource-dialog" aria-labelledby="resource-dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Reference library</p>
          <h2 id="resource-dialog-title">Course resources</h2>
        </div>
        <button class="icon-button" id="close-resources" type="button" aria-label="Close resources">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <label class="search-label" for="resource-search">Search resources</label>
      <input class="search-input" id="resource-search" type="search" placeholder="Search by topic or source" />
      <div class="resource-list" id="resource-list"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
